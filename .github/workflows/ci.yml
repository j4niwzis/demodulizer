name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build and check (libstdc++, import std)
    runs-on: ubuntu-latest
    # libstdc++ 15, whose `bits/std.cc` CMake compiles as the `std` module.
    # The runner images ship an older one, and nothing older will do.
    container: ubuntu:26.04
    permissions:
      contents: write
    env:
      CMAKE_VERSION: 4.4.3
    steps:
      - name: prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release ninja-build python3 \
            software-properties-common wget xz-utils libstdc++-15-dev

      # The libtooling wrapper is generated against clang 22's headers, and the
      # modules have to be compiled by the clang that produced the BMIs.
      - name: clang 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 22 all
          ln -sf /usr/lib/llvm-22/bin/clang++ /usr/local/bin/clang++
          ln -sf /usr/lib/llvm-22/bin/clang /usr/local/bin/clang

      - name: cmake ${{ env.CMAKE_VERSION }}
        run: |
          mkdir -p /opt/cmake
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo /opt/cmake/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang

      - name: build
        run: cmake --build build -j"$(nproc)"

      # Every check in here failed once while this was being written.
      - name: what it has to get right
        run: CXX=clang++ TOOL="$PWD/build/demodulizer" tests/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: demodulizer-linux-x86_64
          path: build/demodulizer

      - name: attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/demodulizer
          fail_on_unmatched_files: true
